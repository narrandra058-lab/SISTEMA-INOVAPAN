<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes | InovaPan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/estilo.css">

</head>

<body>


<aside class="sidebar">

    <div class="logo">

        <div class="logo-icon">
            <i class="bi bi-cup-hot-fill"></i>
        </div>

        <div class="logo-text">

            <strong>InovaPan</strong>

            <span>Gestão de Panificadora</span>

        </div>

    </div>


    <div class="menu-titulo">
        Menu
    </div>


    <ul class="menu">

        <li>
            <a href="dashboard.html">
                <i class="bi bi-grid"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <li>
            <a href="clientes.html" class="active">
                <i class="bi bi-people"></i>
                <span>Clientes</span>
            </a>
        </li>

        <li>
            <a href="produtos.html">
                <i class="bi bi-basket"></i>
                <span>Produtos</span>
            </a>
        </li>

        <li>
            <a href="pedidos.html">
                <i class="bi bi-receipt"></i>
                <span>Pedidos</span>
            </a>
        </li>

        <li>
            <a href="relatorios.html">
                <i class="bi bi-bar-chart"></i>
                <span>Relatórios</span>
            </a>
        </li>

    </ul>


    <div class="menu-sair">

        <a href="#" onclick="sairSistema()">

            <i class="bi bi-box-arrow-left"></i>

            <span>Sair</span>

        </a>

    </div>

</aside>


<main class="main">


<header class="topbar">

    <div class="topbar-titulo">
        Clientes
    </div>

    <div class="usuario">

        <div class="usuario-avatar">
            <i class="bi bi-person"></i>
        </div>

        <div class="usuario-info">

            <strong>Usuário</strong>

            <span>Administrador</span>

        </div>

    </div>

</header>


<section class="conteudo">


<div class="titulo-pagina">

    <div>

        <h1>Clientes</h1>

        <p>
            Cadastre e gerencie os clientes da panificadora.
        </p>

    </div>


    <button
        class="btn-principal"
        data-bs-toggle="modal"
        data-bs-target="#modalCliente">

        <i class="bi bi-plus"></i>

        Novo cliente

    </button>

</div>


<div class="area-filtros">

    <div class="campo-pesquisa">

        <i class="bi bi-search"></i>

        <input
            type="text"
            id="buscarCliente"
            placeholder="Buscar cliente...">

    </div>

</div>


<div class="card-sistema">

    <div class="table-responsive">

        <table class="tabela">

            <thead>

                <tr>

                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Endereço</th>
                    <th>Ações</th>

                </tr>

            </thead>


            <tbody id="listaClientes">

                <tr>

                    <td colspan="5"
                        class="text-center">

                        Nenhum cliente cadastrado.

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


</section>

</main>


<!-- MODAL -->

<div class="modal fade" id="modalCliente">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Novo cliente
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>


<form id="formCliente">

<div class="modal-body">

<div class="mb-3">

<label class="form-label">
Nome
</label>

<input
type="text"
class="form-control"
id="nomeCliente"
required>

</div>


<div class="mb-3">

<label class="form-label">
Telefone
</label>

<input
type="text"
class="form-control"
id="telefoneCliente"
required>

</div>


<div class="mb-3">

<label class="form-label">
E-mail
</label>

<input
type="email"
class="form-control"
id="emailCliente">

</div>


<div class="mb-3">

<label class="form-label">
Endereço
</label>

<input
type="text"
class="form-control"
id="enderecoCliente"
required>

</div>

</div>


<div class="modal-footer">

<button
type="button"
class="btn-secundario"
data-bs-dismiss="modal">

Cancelar

</button>

<button
type="submit"
class="btn-principal">

Salvar cliente

</button>

</div>

</form>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/app.js"></script>
<script src="js/clientes.js"></script>

</body>

</html>
