<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - InovaPan</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-4">

    <h1>Pedidos</h1>

    <div class="card mt-4">
        <div class="card-body">

            <h5>Novo pedido</h5>

            <form id="formPedido">

                <div class="mb-3">
                    <label for="clientePedido" class="form-label">
                        Cliente
                    </label>

                    <select id="clientePedido" class="form-select" required>
                        <option value="">Selecione o cliente</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="produtoPedido" class="form-label">
                        Produto
                    </label>

                    <select id="produtoPedido" class="form-select" required>
                        <option value="">Selecione o produto</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="quantidadePedido" class="form-label">
                        Quantidade
                    </label>

                    <input
                        type="number"
                        id="quantidadePedido"
                        class="form-control"
                        min="1"
                        value="1"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Criar pedido
                </button>

            </form>

        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body">

            <h5>Pedidos cadastrados</h5>

            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Data</th>
                        <th>Total</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaPedidos"></tbody>
            </table>

        </div>
    </div>

</div>

<script src="js/api.js"></script>
<script src="js/pedidos.js"></script>

</body>
</html>
